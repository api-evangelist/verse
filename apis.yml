name: Verse
description: >-
  Verse (verse.inc) is a private company backed by Bessemer Venture Partners,
  surfaced into the API Evangelist network from Bessemer's portfolio. Its public
  marketing site is served entirely behind a Cloudflare bot challenge, so the
  product and sector could not be independently characterized from the site
  itself during enrichment. What is verifiable: Verse operates a live,
  authenticated backend API at api.verse.inc built on the Connect RPC protocol
  (a gRPC-compatible framework — the host advertises the Connect-Protocol-Version
  header and OPTIONS/GET/POST/PATCH/DELETE methods), fronted by Google
  infrastructure, and it publishes an RFC 9116 security.txt naming a security
  contact. No public OpenAPI, developer docs, SDKs, or MCP server were
  discoverable. Sector remains undetermined pending further research.
